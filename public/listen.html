<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>आपकी पर्ची · Your prescription</title>
<meta name="theme-color" content="#e2eae4">
<link rel="preload" href="/fonts/tiro-deva.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/mukta-400-deva.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body class="listen-page">
<header class="letterhead">
  <span class="brand">
    <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
      <rect x="6" y="3" width="22" height="30" rx="2.5" fill="#fcfcfa" stroke="#1d3b8f" stroke-width="2"/>
      <path d="M11 11h9M11 16h12M11 21h7" stroke="#1d3b8f" stroke-width="2" stroke-linecap="round"/>
      <path d="M29 17c2.2 1.8 2.2 6.2 0 8M32.5 14c4 3.4 4 10.6 0 14" fill="none" stroke="#6a3fa6" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="brand-name">बोलती पर्ची<span>Bolti Parchi</span></span>
  </span>
</header>

<main class="desk">
  <section class="slip" id="loading"><p>पर्ची खुल रही है… <span lang="en">Opening your prescription…</span></p></section>

  <section class="slip hidden" id="error">
    <h1 id="errorText"></h1>
    <p class="expires">अपने डॉक्टर से नया लिंक मांगें। <span lang="en">Ask your doctor for a new link.</span></p>
  </section>

  <section class="slip hidden" id="patient">
    <div class="stamp" aria-hidden="true"><b>स्वीकृत</b><span>APPROVED</span><small id="stampLine"></small></div>
    <h1 id="title">आपकी दवाइयां</h1>
    <p class="lead" id="subtitle">डॉक्टर ने जांच कर यह संदेश भेजा है। जितनी बार चाहें सुनें।</p>

    <div class="lang-switch" role="group" aria-label="Language / भाषा">
      <button id="hi" type="button" aria-pressed="true">हिन्दी</button>
      <button id="en" type="button" aria-pressed="false" lang="en">English</button>
    </div>

    <button id="play" class="big-play" type="button" aria-describedby="playLabel">
      <svg id="iconPlay" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
      <svg id="iconPause" class="hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>
    </button>
    <p class="play-label" id="playLabel">सुनें</p>
    <audio id="audio" controls class="hidden"></audio>
    <button id="stop" class="quiet hidden" type="button">रोकें</button>
    <div id="speechStatus" class="status" role="status"></div>

    <div id="script"></div>
    <p class="expires" id="expires"></p>
  </section>
</main>
<script type="module" src="/listen.js"></script>
</body>
</html>
