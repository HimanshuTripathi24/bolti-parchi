# One-click setup on Render (render.com): New → Blueprint → pick this repository.
services:
  - type: web
    name: bolti-parchi
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: LINK_SECRET
        generateValue: true
      - key: GEMINI_MODELS
        value: gemini-pro-latest,gemini-3-flash-preview,gemini-flash-latest,gemini-3.8-flash,gemini-3.5-flash
      - key: LINK_DAYS
        value: "30"
